<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mein Tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Mein Gesundheits-Tracker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203331;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.shell{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}header{background:#103532;color:white;padding:24px 18px 27px;margin:0 -16px 17px;border-radius:0 0 25px 25px}header small{color:#b4d7ce;letter-spacing:.08em;text-transform:uppercase;font-weight:700}h1{font-size:26px;margin:8px 0 4px}header p{margin:0;color:#cde2dc;font-size:14px}.topnav{display:flex;gap:7px;margin:18px 0 4px}.topnav button{flex:1;border:0;border-radius:13px;padding:12px 5px;background:#e4ece8;color:#3d514c;font-size:13px;font-weight:700}.topnav button.active{background:#216b5b;color:white}.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0}.datebar button{border:0;background:white;border-radius:12px;padding:10px 12px;color:#1f5d50}.datebar input{border:0;background:white;padding:10px 5px;border-radius:10px;min-width:0;max-width:165px;text-align:center;font-weight:700;color:#21483e}.card{background:white;border-radius:19px;padding:17px;margin:13px 0;box-shadow:0 4px 18px #102b2b0c}.sectitle{display:flex;justify-content:space-between;align-items:center;gap:12px}.sectitle h2{font-size:19px;margin:0}.pill{font-size:12px;font-weight:700;background:#e6f3ef;padding:5px 9px;border-radius:20px;color:#1b6854}.item{padding:15px 0;border-bottom:1px solid #eef2ef}.item:last-child{border:0;padding-bottom:3px}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:9px}.itemhead strong{font-size:15px}.help{font-size:12px;color:#788781;margin-top:3px;line-height:1.4}.score{display:flex;gap:6px}.score button{flex:1;padding:10px 0;border-radius:10px;border:1px solid #d9e5df;background:#f8faf8;color:#4d5b55;font-weight:700}.score button.selected{background:#216b5b;color:#fff;border-color:#216b5b}.score button.bad.selected{background:#bc5b4e;border-color:#bc5b4e}.score button.mid.selected{background:#d79430;border-color:#d79430}.muted{color:#70817a;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;padding:14px 10px;border-radius:15px;text-align:center}.stat strong{display:block;font-size:21px;color:#216b5b}.stat span{font-size:11px;color:#70817a}.progress{height:8px;background:#e5eeea;border-radius:8px;overflow:hidden;margin-top:12px}.progress i{height:100%;display:block;background:#3b947c;border-radius:8px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:1px solid #dde8e2;background:#f8faf9;padding:10px 2px;border-radius:11px;min-width:0}.day strong{display:block;font-size:14px}.day small{font-size:10px;color:#70817a}.day.on{border-color:#216b5b;background:#e7f4ee}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1ee}.summary:last-child{border:0}.bar{background:#eaf1ed;border-radius:10px;height:10px;overflow:hidden;min-width:85px;width:38%}.bar>i{display:block;height:100%;background:#3b947c}.goals li{margin-bottom:9px;line-height:1.4}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.secondary{background:#e9f0ed;border:0;border-radius:10px;padding:11px;color:#215647;font-weight:650}.warning{background:#fff3e4;border-radius:12px;padding:12px;font-size:13px;color:#865f20;line-height:1.5}.hidden{display:none}.foot{font-size:12px;color:#76867e;text-align:center;margin:18px}.tag{font-size:12px;color:#76867e}.notice{margin-top:8px;color:#276b59;font-size:12px;font-weight:650}
</style></head><body><div class="shell"><header><small>Deine tägliche Checkliste</small><h1>Gesund leben. Jeden Tag.</h1><p>Ernährung · Schlaf · Bewegung</p></header><div class="topnav"><button data-tab="today" class="active">Tag</button><button data-tab="week">Woche</button><button data-tab="goals">Ziele</button><button data-tab="data">Daten</button></div><main id="app"></main><p class="foot">Deine Einträge bleiben standardmäßig auf diesem Gerät.</p></div><script src="data.js"></script><script>
'use strict';const GROUPS=[{name:'Ernährung',icon:'🥗',fields:[['zucker','Kein Zucker','Wenig zuckerhaltige Lebensmittel'],['kh','Wenig Kohlenhydrate','Nudeln, Reis, Kartoffeln und andere Kohlenhydratquellen'],['alkohol','Wenig Alkohol','5 = kein Alkohol · 4 = kleines Bier/⅛ Wein · 3 = zwei Gläser'],['fette','Viele gute Fette','Fettqualität beachten; z. B. Olivenöl, Nüsse']]},{name:'Schlaf',icon:'🌙',fields:[['dauer','Dauer','Garmin: ausgezeichnet = 5, gut = 4, ausreichend = 3'],['stress','Stress','Garmin-Schlafbewertung'],['tief','Tiefschlaf','Garmin-Schlafbewertung'],['leicht','Leichtschlaf','Garmin-Schlafbewertung'],['rem','REM-Schlaf','Garmin-Schlafbewertung'],['wach','Wachphasen','Garmin-Schlafbewertung']]},{name:'Bewegung',icon:'🚶',fields:[['schritte','8.000 Schritte','Originalskala: >8.000 = 5, >7.000 = 4, >6.000 = 3 usw.'],['stiege','10× Stiege','≥10 = 5, ≥9 = 4, ≥8 = 3 usw.'],['qigong','Qi Gong','5 = trainiert · 0 = nicht trainiert'],['sport','Sportliche Aktivität','Ausdauer, Intervalltraining oder Krafttraining']]}];
const KEY='gesundheits_tracker_v1';let records;try{let saved=JSON.parse(localStorage.getItem(KEY));records=saved&&typeof saved==='object'?saved:structuredClone(INITIAL_DATA)}catch(e){records=structuredClone(INITIAL_DATA)};let selected=iso(new Date()),tab='today';const app=document.getElementById('app');function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function parse(s){return new Date(s+'T12:00:00')}function shift(s,n){let d=parse(s);d.setDate(d.getDate()+n);return iso(d)}function nice(s){return parse(s).toLocaleDateString('de-AT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function weekstart(s){let d=parse(s),n=(d.getDay()+6)%7;return shift(s,-n)}function weekdays(s){let z=weekstart(s);return Array.from({length:7},(_,i)=>shift(z,i))}function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){alert('Speichern nicht möglich. Bitte Datenexport verwenden.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function numbers(obj,group){let v=group.fields.map(x=>obj?.[x[0]]).filter(x=>Number.isInteger(x)&&x>=0&&x<=5);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length/5*100):null}function pct(v){return v===null?'–':v+' %'}function head(title){return `<div class="sectitle"><h2>${title}</h2></div>`}function statHTML(o){return `<div class="stats">${GROUPS.map(g=>`<div class="stat"><strong>${pct(numbers(o,g))}</strong><span>${g.icon} ${g.name}</span></div>`).join('')}</div>`}function datebar(){return `<div class="datebar"><button id="prev" aria-label="Vortag">‹</button><input type="date" id="date" value="${selected}" aria-label="Datum"><button id="next" aria-label="Nächster Tag">›</button></div>`}
function renderToday(){let o=records[selected]||{};app.innerHTML=datebar()+statHTML(o)+GROUPS.map(g=>`<section class="card"><div class="sectitle"><h2>${g.icon} ${g.name}</h2><span class="pill">${pct(numbers(o,g))}</span></div>${g.fields.map(([k,l,h])=>`<div class="item"><div class="itemhead"><div><strong>${esc(l)}</strong><div class="help">${esc(h)}</div></div><span class="tag">${o[k]===undefined?'offen':o[k]+'/5'}</span></div><div class="score" role="group" aria-label="${esc(l)}">${[0,1,2,3,4,5].map(v=>`<button class="${o[k]===v?'selected '+(v<3?'bad':v<5?'mid':''):''}" data-key="${k}" data-score="${v}" aria-pressed="${o[k]===v}">${v}</button>`).join('')}</div></div>`).join('')}</section>`).join('')+`<p class="muted">Tipp: Tippe einen bereits ausgewählten Wert erneut an, um ihn zu löschen. 0 = schlecht, 5 = gut.</p>`;document.getElementById('prev').onclick=()=>{selected=shift(selected,-1);render()};document.getElementById('next').onclick=()=>{selected=shift(selected,1);render()};document.getElementById('date').onchange=e=>{if(e.target.value){selected=e.target.value;render()}};app.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{let k=b.dataset.key,v=+b.dataset.score;records[selected]??={};if(records[selected][k]===v)delete records[selected][k];else records[selected][k]=v;if(!Object.keys(records[selected]).length)delete records[selected];save();renderToday()})}
function renderWeek(){let days=weekdays(selected);let agg=GROUPS.map(g=>{let v=days.flatMap(d=>g.fields.map(f=>records[d]?.[f[0]]).filter(x=>Number.isInteger(x)));return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*20):null});let filled=days.filter(d=>Object.keys(records[d]||{}).length).length;app.innerHTML=`<section class="card">${head('Wochenübersicht')}<p class="muted">${nice(days[0])} – ${nice(days[6])}</p><div class="weekdays">${days.map(d=>`<button class="day ${Object.keys(records[d]||{}).length?'on':''}" data-day="${d}"><small>${parse(d).toLocaleDateString('de-AT',{weekday:'short'})}</small><strong>${parse(d).getDate()}</strong></button>`).join('')}</div><p class="muted">${filled} von 7 Tagen mit Einträgen</p></section><section class="card">${head('Durchschnittliche Erfüllung')}${GROUPS.map((g,i)=>`<div class="summary"><div><strong>${g.icon} ${g.name}</strong><div class="muted">${pct(agg[i])}</div></div><div class="bar"><i style="width:${agg[i]||0}%"></i></div></div>`).join('')}<p class="muted">Durchschnitt der vorhandenen Bewertungen. Fehlende Einträge zählen nicht als 0.</p></section><section class="card">${head('Letzte 8 Wochen')}${Array.from({length:8},(_,i)=>{let ws=shift(weekstart(selected),-7*i),ds=weekdays(ws),v=ds.flatMap(d=>GROUPS.flatMap(g=>g.fields.map(f=>records[d]?.[f[0]]).filter(x=>Number.isInteger(x))));let avg=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*20):null;return `<div class="summary"><span>${parse(ws).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'})}</span><div class="bar"><i style="width:${avg||0}%"></i></div><strong>${pct(avg)}</strong></div>`}).join('')}</section>`;app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;tab='today';render()})}
function renderGoals(){app.innerHTML=`<section class="card">${head('Deine Maßnahmen aus Excel')}<p class="muted">Übernommen aus dem Blatt „Review“.</p><ul class="goals"><li><strong>Alkohol:</strong> nur am Wochenende, maximal zweimal pro Woche</li><li><strong>Süßes:</strong> maximal zweimal pro Woche</li><li><strong>Schlaf:</strong> mindestens 8 Stunden im Schlafzimmer, als Voraussetzung für längeren Schlaf und spätere REM-Phasen</li><li><strong>Schritte:</strong> höchstens einmal pro Woche unter 8.000</li><li><strong>Qi Gong:</strong> einmal täglich</li><li><strong>Liegestütze:</strong> 30 pro Tag</li><li><strong>Fitnessstudio:</strong> zweimal Muskeltraining pro Woche</li><li><strong>Hometrainer:</strong> zweimal pro Woche</li></ul><div class="warning">Die Maßnahmen sind persönliche Ziele aus deiner Datei, keine automatisch geprüften Gesundheitsempfehlungen. Die sechs Garmin-Schlafwerte werden derzeit manuell bewertet.</div></section><section class="card">${head('So funktioniert die Bewertung')}<p class="muted">Jedes der 14 Kriterien erhält 0 bis 5 Punkte. Die Kategorien werden aus den tatsächlich eingegebenen Werten berechnet. In der Wochenansicht siehst du den Durchschnitt.</p></section>`}
function dl(name,type,content){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}function renderData(){let n=Object.keys(records).length;app.innerHTML=`<section class="card">${head('Datensicherung')}<p>Aktuell sind <strong>${n} Tage</strong> mit Einträgen gespeichert.</p><div class="toolbar"><button class="secondary" id="export">JSON sichern</button><button class="secondary" id="csv">CSV exportieren</button><button class="secondary" id="import">JSON importieren</button><input type="file" id="file" accept=".json,application/json" class="hidden"></div><p class="muted">Sichere deine Daten regelmäßig als JSON in der iPhone-App „Dateien“. Der JSON-Import ersetzt die vorhandenen Einträge, damit du einen anderen Stand wiederherstellen kannst.</p></section><section class="card"><div class="warning">Die App speichert lokal im Browser. Beim Löschen von Website-Daten oder einem Gerätewechsel können Einträge verloren gehen. Es findet keine automatische Synchronisierung mit Apple Health oder Garmin statt.</div><p class="muted">Historische Excel-Einträge wurden bereits als Ausgangsdaten übernommen. Es wurden die Spalten C–I entlang der angegebenen Wochenzeiträume Montag–Sonntag zugeordnet, weil die Wochentagsüberschriften in Excel hierzu nicht passen.</p><button class="secondary" id="reset">Originaldaten wiederherstellen</button></section>`;document.getElementById('export').onclick=()=>dl('gesundheits-tracker-backup.json','application/json',JSON.stringify(records,null,2));document.getElementById('csv').onclick=()=>{let keys=GROUPS.flatMap(g=>g.fields.map(f=>f[0]));let csv=['Datum;'+keys.join(';'),...Object.entries(records).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,o])=>d+';'+keys.map(k=>o[k]??'').join(';'))].join('\r\n');dl('gesundheits-tracker.csv','text/csv;charset=utf-8','\ufeff'+csv)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj||Array.isArray(obj)||typeof obj!=='object')throw Error();for(let [d,o] of Object.entries(obj)){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!o||typeof o!=='object'||Object.values(o).some(v=>!Number.isInteger(v)||v<0||v>5))throw Error()}if(confirm('Vorhandene Einträge durch diese Sicherung ersetzen?')){records=obj;save();render()}}catch(err){alert('Die Datei ist kein gültiges Tracker-Backup.')}};document.getElementById('reset').onclick=()=>{if(confirm('Alle Änderungen verwerfen und ursprüngliche Excel-Daten wiederherstellen?')){records=structuredClone(INITIAL_DATA);save();render()}}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='today')renderToday();else if(tab==='week')renderWeek();else if(tab==='goals')renderGoals();else renderData()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});save();render();
</script></body></html>
